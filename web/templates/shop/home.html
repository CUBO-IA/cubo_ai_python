{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Shop</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <header>
      <h1>Simple Shop</h1>
      <nav>
        <a href="/">Home</a>
        <a href="/cart/">Cart</a>
      </nav>
    </header>

    <main>
      <h2>Products</h2>

      <div class="products">
        {% for product in products %}
        <article class="product-card">
          <img
            src="{% static 'images/' %}{{ product.image }}"
            alt="{{ product.name }}"
          />

          <h3>{{ product.name }}</h3>
          <p>${{ product.price }}</p>

          <a href="{% url 'product' product.id %}"> View product </a>
        </article>
        {% endfor %}
      </div>
    </main>

    <script src="{% static 'js/main.js' %}"></script>
  </body>
</html>
